# Chặn lộ API key trước khi commit.
# Cài một lần sau khi clone:  pre-commit install
# Quét thủ công toàn repo:    pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: forbid-new-submodules

  # Chặn commit nhầm file .env (kể cả khi bị `git add -f`).
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env files
        entry: "Không commit file .env — key thật chỉ để ở máy. Dùng .env.example cho mẫu."
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'

  # Bắt lỗi Python chắc chắn sai: tên chưa định nghĩa, import thừa, lỗi cú pháp.
  # Không ép style (độ dài dòng, cách đặt tên…).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--select", "F,E9", "--exclude", "__init__.py"]
